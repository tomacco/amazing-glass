<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>amazing-glass in plain HTML</title>
<!-- From the CDN. Swap for ../../dist/ paths when working in this repo. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/tomacco/amazing-glass@main/dist/amazing-glass.css">
<script type="module" src="https://cdn.jsdelivr.net/gh/tomacco/amazing-glass@main/dist/amazing-glass.min.js"></script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, sans-serif;
         background: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1600") center / cover; }
  ag-glass { padding: 24px; border-radius: 32px; display: grid; gap: 16px; width: min(90vw, 360px); }
  .row { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
</style>
<ag-glass variant="regular">
  <div class="row">Wi-Fi <ag-switch checked></ag-switch></div>
  <ag-slider value="60" min-icon="sunSmall" max-icon="sun"></ag-slider>
  <ag-segmented options="Day,Week,Month" value="Week"></ag-segmented>
  <ag-button variant="prominent">Done</ag-button>
</ag-glass>
<script type="module">
  document.querySelector('ag-switch').addEventListener('change', e => console.log('on:', e.target.checked));
</script>
</html>
